name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: python -m pip install --requirement .github/requirements-ci.txt
      - run: shellcheck --version
      - run: >-
          sh -n bootstrap.sh install.sh scripts/*.sh tests/*.sh &&
          shellcheck bootstrap.sh install.sh scripts/*.sh tests/*.sh
      - run: yamllint .
      - run: ansible-playbook -i inventories/example/hosts.yml playbooks/site.yml --syntax-check
      - run: ansible-lint playbooks/site.yml
      - run: python3 scripts/validate-vars.py
      - run: scripts/secrets-check.sh
      - run: scripts/actions-policy-check.sh
      - run: scripts/dependency-policy-check.sh
      - run: tests/test-release-assets.sh
      - run: docker compose -f compose/searxng/compose.yml config --quiet
