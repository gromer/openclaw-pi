name: Publish bootstrap assets
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.release.tag_name }}"}
      - run: shellcheck bootstrap.sh && sha256sum bootstrap.sh > bootstrap.sh.sha256
      - env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release upload "${{ github.event.release.tag_name }}" bootstrap.sh bootstrap.sh.sha256 --clobber

