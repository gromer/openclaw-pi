---
name: Publish bootstrap assets
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to release
        required: true
        type: string
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-24.04
    environment: release
    env:
      RELEASE_TAG: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          fetch-depth: 0
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            *[!A-Za-z0-9._-]*|'')
              echo "ERROR: invalid release tag $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          object_type=$(git for-each-ref --format='%(objecttype)' "refs/tags/$RELEASE_TAG")
          [ -n "$object_type" ] || { echo "ERROR: tag $RELEASE_TAG not found" >&2; exit 1; }
          [ "$object_type" = "tag" ] || {
            echo "ERROR: lightweight tags are rejected; create an annotated signed tag" >&2
            exit 1
          }
      - name: Prepare draft release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$is_draft" != "true" ]; then
              echo "ERROR: release $RELEASE_TAG is already published; rebuilding is not allowed" >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes
          fi
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG"
      - name: Validate release source
        run: |
          shellcheck bootstrap.sh install.sh scripts/*.sh tests/*.sh
          sh -n bootstrap.sh install.sh scripts/*.sh tests/*.sh
      - name: Build deterministic release bundle
        run: scripts/build-release-assets.sh "$RELEASE_TAG" dist
      - name: Upload release assets
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/bootstrap.sh \
            dist/bootstrap.sh.sha256 \
            dist/install.sh \
            dist/install.sh.sha256 \
            "dist/openclaw-pi-${RELEASE_TAG}.tar.gz" \
            "dist/openclaw-pi-${RELEASE_TAG}.tar.gz.sha256" \
            dist/release-manifest.json \
            dist/release-manifest.json.sha256
      - name: Publish release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: gh release edit "$RELEASE_TAG" --draft=false
