---
- name: Read OpenClaw user numeric id
  ansible.builtin.getent:
    database: passwd
    key: "{{ openclaw_user }}"
- name: Define OpenClaw user manager bus environment
  ansible.builtin.set_fact:
    verification_openclaw_user_manager_environment:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[openclaw_user][1] }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[openclaw_user][1] }}/bus"
- name: Check OpenClaw user service state
  ansible.builtin.command:
    argv: [systemctl, --user, show, openclaw-gateway.service, -p, ActiveState, -p, UnitFileState, --no-pager]
  become: true
  become_user: "{{ openclaw_user }}"
  environment: "{{ verification_openclaw_user_manager_environment }}"
  register: verification_openclaw_service
  changed_when: false
- name: Verify OpenClaw user service is active and enabled
  ansible.builtin.assert:
    that:
      - "'ActiveState=active' in verification_openclaw_service.stdout_lines"
      - "'UnitFileState=enabled' in verification_openclaw_service.stdout_lines"
- name: Read supplementary groups from the OpenClaw user manager
  ansible.builtin.command:
    argv: [systemd-run, --user, --wait, --pipe, --collect, /usr/bin/id, -Gn]
  become: true
  become_user: "{{ openclaw_user }}"
  environment: "{{ verification_openclaw_user_manager_environment }}"
  register: verification_user_manager_groups
  changed_when: false
- name: Require Docker group access in the OpenClaw user manager
  ansible.builtin.assert:
    that:
      - "'docker' in verification_user_manager_groups.stdout.split()"
    fail_msg: >-
      The running OpenClaw user manager does not have Docker group access.
      Group changes do not update an already-running user manager. Reboot the
      host and rerun provisioning and verification before relying on Docker
      agent sandboxes.
- name: Verify OpenClaw can access the Docker sandbox backend
  ansible.builtin.command:
    argv: [docker, version]
  become: true
  become_user: "{{ openclaw_user }}"
  changed_when: false
- name: Verify gateway health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port }}/health"
    status_code: [200, 204]
  register: verification_gateway_health
  retries: 12
  delay: 5
  until: verification_gateway_health.status in [200, 204]
- name: Verify SearXNG loopback health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ searxng_port }}/healthz"
    status_code: 200
  register: verification_searxng_health
  retries: 12
  delay: 5
  until: verification_searxng_health.status == 200
- name: Inspect running sandbox containers
  ansible.builtin.command: docker ps --filter name=openclaw-sbx- --format "{{ '{{' }}.ID{{ '}}' }}"
  register: verification_sandbox_containers
  changed_when: false
- name: Verify sandbox isolation for existing containers
  ansible.builtin.shell: |
    set -o pipefail
    docker inspect {{ item }} --format \
      '{{ "{{" }}json .HostConfig{{ "}}" }}' |
      jq -e '.Privileged == false and .NetworkMode == "none" and .ReadonlyRootfs == true
      and (.CapDrop | index("ALL")) != null and .PidMode == "" and .IpcMode != "host"'
  args:
    executable: /bin/bash
  loop: "{{ verification_sandbox_containers.stdout_lines }}"
  changed_when: false
