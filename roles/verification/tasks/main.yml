---
- name: Gather service facts
  ansible.builtin.service_facts:
- name: Verify required services
  ansible.builtin.assert:
    that:
      - ansible_facts.services['docker.service'].state == 'running'
      - ansible_facts.services['openclaw.service'].state == 'running'
- name: Verify gateway loopback health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port }}/health"
    status_code: [200, 204]
  register: gateway_health
  retries: 12
  delay: 5
  until: gateway_health.status in [200, 204]
- name: Verify SearXNG loopback health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ searxng_port }}/healthz"
    status_code: 200
- name: Inspect running sandbox containers
  ansible.builtin.command: docker ps --filter name=openclaw-sbx- --format "{{ '{{' }}.ID{{ '}}' }}"
  register: sandbox_containers
  changed_when: false
- name: Verify sandbox isolation for existing containers
  ansible.builtin.shell: >-
    docker inspect {{ item }} --format
    '{{ "{{" }}json .HostConfig{{ "}}" }}' |
    jq -e '.Privileged == false and .NetworkMode == "none" and .ReadonlyRootfs == true
    and (.CapDrop | index("ALL")) != null and .PidMode == "" and .IpcMode != "host"'
  loop: "{{ sandbox_containers.stdout_lines }}"
  changed_when: false

