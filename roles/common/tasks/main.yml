---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ pi_hostname }}"
- name: Resolve configured hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\\.0\\.1\\.1\\s+'
    line: "127.0.1.1 {{ pi_hostname }}"
    owner: root
    group: root
    mode: '0644'
    create: false
- name: Inspect configured timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_timezone
  changed_when: false
- name: Configure timezone
  ansible.builtin.command: "timedatectl set-timezone {{ common_timezone }}"
  when: common_current_timezone.stdout != common_timezone
  changed_when: true
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Inspect active NetworkManager connection
  ansible.builtin.command: >-
    nmcli -g ipv4.method,ipv4.addresses,ipv4.gateway connection show {{ pi_network_connection }}
  register: common_network_current
  changed_when: false
  when: pi_manage_network
- name: Configure declared DHCP network settings
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ pi_network_connection }}"
      - ipv4.method
      - auto
      - ipv4.addresses
      - ""
      - ipv4.gateway
      - ""
      - ipv4.dns
      - "{{ pi_dns_servers | join(',') }}"
  when: pi_manage_network and pi_network_mode == 'dhcp' and 'auto' not in common_network_current.stdout
  changed_when: true
  notify: Activate network connection
- name: Configure declared static network settings
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ pi_network_connection }}"
      - ipv4.method
      - manual
      - ipv4.addresses
      - "{{ pi_static_address }}"
      - ipv4.gateway
      - "{{ pi_static_gateway }}"
      - ipv4.dns
      - "{{ pi_dns_servers | join(',') }}"
  when: >-
    pi_manage_network and pi_network_mode == 'static' and
    (pi_static_address not in common_network_current.stdout or pi_static_gateway not in common_network_current.stdout)
  changed_when: true
  notify: Activate network connection
