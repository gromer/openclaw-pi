---
- name: Install NodeSource repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
- name: Download NodeSource signing key
  ansible.builtin.get_url:
    url: "{{ openclaw_nodesource_key_url }}"
    dest: "{{ openclaw_nodesource_key_source }}"
    mode: '0644'
  register: openclaw_nodesource_key_download
- name: Check NodeSource apt keyring
  ansible.builtin.stat:
    path: "{{ openclaw_nodesource_keyring }}"
  register: openclaw_nodesource_keyring_stat
- name: Verify NodeSource signing key fingerprint
  ansible.builtin.command:
    argv: [gpg, --batch, --no-options, --no-default-keyring, --show-keys, --with-colons, "{{ openclaw_nodesource_key_source }}"]
  register: openclaw_nodesource_key_info
  changed_when: false
  failed_when: openclaw_nodesource_key_fingerprint not in openclaw_nodesource_key_info.stdout
- name: Convert NodeSource key to apt keyring
  ansible.builtin.command:
    argv: [gpg, --batch, --yes, --dearmor, --output, "{{ openclaw_nodesource_keyring }}", "{{ openclaw_nodesource_key_source }}"]
  register: openclaw_nodesource_keyring_result
  changed_when: true
  when: openclaw_nodesource_key_download.changed or not openclaw_nodesource_keyring_stat.stat.exists
- name: Set NodeSource apt keyring permissions
  ansible.builtin.file:
    path: "{{ openclaw_nodesource_keyring }}"
    owner: root
    group: root
    mode: '0644'
    state: file
- name: Configure verified NodeSource repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ openclaw_nodesource_apt_arch }} signed-by={{ openclaw_nodesource_keyring }}]
      https://deb.nodesource.com/node_{{ node_major }}.x nodistro main
    filename: nodesource
    state: present
- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
- name: Check installed OpenClaw version
  ansible.builtin.command: "{{ openclaw_npm_prefix }}/bin/openclaw --version"
  register: openclaw_installed
  changed_when: false
  failed_when: false
- name: Ensure OpenClaw npm prefix is owned by its service account
  ansible.builtin.file:
    path: "{{ openclaw_npm_prefix }}"
    state: directory
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0755'
- name: Download and verify OpenClaw npm release
  when: openclaw_installed.rc != 0 or openclaw_version not in openclaw_installed.stdout
  block:
    - name: Create private npm download directory
      ansible.builtin.tempfile:
        state: directory
        prefix: openclaw-npm-
      register: openclaw_npm_download_dir
      become_user: "{{ openclaw_user }}"
    - name: Download OpenClaw tarball without lifecycle scripts
      ansible.builtin.command:
        argv: [npm, pack, --ignore-scripts, --pack-destination, "{{ openclaw_npm_download_dir.path }}", "openclaw@{{ openclaw_version }}"]
      environment:
        npm_config_update_notifier: "false"
        npm_config_audit: "false"
        npm_config_cache: "{{ openclaw_state_dir }}/.npm"
      register: openclaw_npm_pack
      changed_when: true
      become_user: "{{ openclaw_user }}"
    - name: Locate downloaded OpenClaw tarball
      ansible.builtin.find:
        paths: "{{ openclaw_npm_download_dir.path }}"
        patterns: openclaw-*.tgz
        file_type: file
      register: openclaw_npm_packages
    - name: Require exactly one OpenClaw tarball
      ansible.builtin.assert:
        that: openclaw_npm_packages.files | length == 1
        fail_msg: "npm pack did not produce exactly one OpenClaw tarball."
    - name: Calculate OpenClaw tarball integrity
      ansible.builtin.command:
        argv:
          - node
          - -e
          - >-
            const fs=require('fs'), crypto=require('crypto');
            process.stdout.write('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'));
          - "{{ openclaw_npm_packages.files[0].path }}"
      register: openclaw_npm_integrity_actual
      changed_when: false
      become_user: "{{ openclaw_user }}"
    - name: Verify OpenClaw npm dist.integrity
      ansible.builtin.assert:
        that: openclaw_npm_integrity_actual.stdout == openclaw_npm_integrity
        fail_msg: "OpenClaw npm tarball integrity does not match openclaw_npm_integrity."
    - name: Install verified OpenClaw npm release
      ansible.builtin.command:
        argv:
          - npm
          - install
          - --global
          - --prefix
          - "{{ openclaw_npm_prefix }}"
          - --allow-scripts=openclaw
          - "{{ openclaw_npm_packages.files[0].path }}"
      environment:
        npm_config_update_notifier: "false"
        npm_config_audit: "false"
        npm_config_cache: "{{ openclaw_state_dir }}/.npm"
      become_user: "{{ openclaw_user }}"
      notify: Restart OpenClaw
  always:
    - name: Remove temporary npm download directory
      ansible.builtin.file:
        path: "{{ openclaw_npm_download_dir.path }}"
        state: absent
      when: openclaw_npm_download_dir.path is defined
- name: Decrypt production secrets in memory
  ansible.builtin.command: "sops --decrypt --output-type yaml {{ secrets_file }}"
  delegate_to: localhost
  become: false
  register: decrypted_secrets
  changed_when: false
  no_log: true
  when: secrets_file | length > 0
- name: Parse secrets
  ansible.builtin.set_fact:
    openclaw_secrets: "{{ decrypted_secrets.stdout | from_yaml }}"
  no_log: true
  when: secrets_file | length > 0
- name: Use empty secrets for validation-only example runs
  ansible.builtin.set_fact:
    openclaw_secrets: {}
  when: secrets_file | length == 0
- name: Validate required secrets
  ansible.builtin.assert:
    that:
      - openclaw_secrets.gateway_token | default('') | length >= 32
      - openclaw_secrets.searxng_secret_key | default('') | length >= 32
      - not restic_enabled or openclaw_secrets.restic_password | default('') | length >= 20
  no_log: true
  when: secrets_file | length > 0
- name: Reject unsupported characters in environment secrets
  ansible.builtin.assert:
    that:
      - not (openclaw_secrets.gateway_token | default('') | regex_search('[\r\n]'))
      - not (openclaw_secrets.inference_api_key | default('') | regex_search('[\r\n]'))
    fail_msg: "OpenClaw secrets must not contain raw newline characters."
  no_log: true
- name: Validate OpenClaw string inventory values
  ansible.builtin.assert:
    that:
      - openclaw_gateway_bind is string
      - inference_base_url is string
      - inference_model is string
      - openclaw_provider_id is string
      - openclaw_workspace_dir is string
      - sandbox_mode is string
      - sandbox_scope is string
      - sandbox_workspace_access is string
      - sandbox_image is string
      - sandbox_network is string
      - sandbox_memory is string
      - sandbox_memory_swap is string
    fail_msg: "OpenClaw string settings must be strings in inventory/group vars."
- name: Install protected environment
  ansible.builtin.template:
    src: environment.j2
    dest: "{{ openclaw_environment_path }}"
    owner: root
    group: "{{ openclaw_group }}"
    mode: '0640'
  no_log: true
  notify: Restart OpenClaw
- name: Render and validate OpenClaw configuration
  block:
    - name: Create temporary OpenClaw configuration file
      ansible.builtin.tempfile:
        state: file
        path: "{{ openclaw_config_path | dirname }}"
        suffix: .json
      register: openclaw_config_candidate
    - name: Render OpenClaw configuration candidate
      ansible.builtin.template:
        src: openclaw.json.j2
        dest: "{{ openclaw_config_candidate.path }}"
        owner: root
        group: "{{ openclaw_group }}"
        mode: '0640'
    - name: Validate OpenClaw configuration candidate
      ansible.builtin.command: "{{ openclaw_npm_prefix }}/bin/openclaw config validate"
      environment:
        OPENCLAW_CONFIG_PATH: "{{ openclaw_config_candidate.path }}"
        OPENCLAW_GATEWAY_TOKEN: validation-placeholder-token
        INFERENCE_API_KEY: validation-placeholder-key
      changed_when: false
    - name: Install validated OpenClaw configuration
      ansible.builtin.copy:
        remote_src: true
        src: "{{ openclaw_config_candidate.path }}"
        dest: "{{ openclaw_config_path }}"
        owner: root
        group: "{{ openclaw_group }}"
        mode: '0640'
      notify: Restart OpenClaw
  always:
    - name: Remove temporary OpenClaw configuration candidate
      ansible.builtin.file:
        path: "{{ openclaw_config_candidate.path }}"
        state: absent
      when: openclaw_config_candidate.path is defined
- name: Check inference endpoint before service restart
  ansible.builtin.uri:
    url: "{{ inference_base_url }}{{ '/api/tags' if inference_backend == 'ollama' else '/models' }}"
    status_code: 200
    timeout: 10
    headers: >-
      {{ {'Authorization': 'Bearer ' + openclaw_secrets.inference_api_key}
      if (openclaw_secrets.inference_api_key | default('') | length > 0) else {} }}
  no_log: true
- name: Install managed workspace files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ openclaw_workspace_dir }}/{{ item }}"
    owner: "{{ openclaw_user }}"
    group: "{{ openclaw_group }}"
    mode: '0600'
  loop: [AGENTS.md, SOUL.md, TOOLS.md]
- name: Install hardened OpenClaw service
  ansible.builtin.template:
    src: openclaw.service.j2
    dest: /etc/systemd/system/openclaw.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart OpenClaw
- name: Enable OpenClaw
  ansible.builtin.systemd_service:
    name: openclaw
    enabled: true
    state: started
    daemon_reload: true
