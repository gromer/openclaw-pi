---
- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, unattended-upgrades]
    state: present
- name: Render SSH hardening drop-in
  ansible.builtin.template:
    src: 50-openclaw-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-openclaw-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
- name: Configure UFW safely
  ansible.builtin.shell: |
    set -eu
    ufw allow {{ ssh_port }}/tcp comment 'SSH management'
    ufw default deny incoming
    ufw default allow outgoing
    ufw --force enable
  args:
    executable: /bin/sh
  register: ufw_result
  changed_when: "'Rules updated' in ufw_result.stdout or 'Firewall is active' not in ufw_result.stdout"
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52-openclaw-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52-openclaw-unattended-upgrades
    mode: '0644'
