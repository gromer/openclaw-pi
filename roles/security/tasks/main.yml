---
- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, unattended-upgrades]
    state: present
- name: Render SSH hardening drop-in
  ansible.builtin.template:
    src: 50-openclaw-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-openclaw-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
- name: Configure UFW safely
  ansible.builtin.shell: |
    set -eu
    ufw default deny incoming
    ufw default allow outgoing
    {% if security_ssh_allowed_cidrs | length > 0 %}
    {% for cidr in security_ssh_allowed_cidrs %}
    ufw allow from {{ cidr }} to any port {{ security_ssh_port }} proto tcp comment 'SSH management'
    {% endfor %}
    ufw delete allow {{ security_ssh_port }}/tcp 2>/dev/null || true
    {% elif security_firewall_allow_lan_gateway | bool and ansible_default_ipv4.gateway is defined %}
    ufw allow from {{ ansible_default_ipv4.gateway }} to any port {{ security_ssh_port }} proto tcp comment 'SSH management (LAN gateway)'
    ufw delete allow {{ security_ssh_port }}/tcp 2>/dev/null || true
    {% else %}
    ufw allow {{ security_ssh_port }}/tcp comment 'SSH management'
    {% endif %}
    ufw --force enable
  args:
    executable: /bin/bash
  register: security_ufw_result
  changed_when: >-
    'Rules updated' in security_ufw_result.stdout or
    'Firewall is active' not in security_ufw_result.stdout or
    'Rule deleted' in security_ufw_result.stdout
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52-openclaw-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52-openclaw-unattended-upgrades
    mode: '0644'
