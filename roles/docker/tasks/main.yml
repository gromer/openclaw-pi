---
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Install Docker signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring }}"
    mode: '0644'
- name: Create isolated GnuPG home for Docker key verification
  ansible.builtin.file:
    path: "{{ docker_gpg_homedir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
- name: Verify Docker signing key fingerprint
  ansible.builtin.command:
    argv:
      - gpg
      - --homedir
      - "{{ docker_gpg_homedir }}"
      - --batch
      - --no-options
      - --no-default-keyring
      - --show-keys
      - --with-colons
      - "{{ docker_apt_keyring }}"
  register: docker_key_info
  changed_when: false
  failed_when: docker_apt_key_fingerprint not in docker_key_info.stdout
- name: Configure official Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring }}]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} {{ docker_apt_channel }}
    filename: docker
    state: present
- name: Install Docker Engine and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart docker
- name: Grant OpenClaw Docker daemon authority
  ansible.builtin.user:
    name: "{{ openclaw_user }}"
    groups: docker
    append: true
  notify: Restart OpenClaw
- name: Enable Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
- name: Verify Docker sandbox tooling as the OpenClaw service account
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [docker, version]
    - [docker, buildx, version]
    - [docker, compose, version]
  become: true
  become_user: "{{ openclaw_user }}"
  changed_when: false
