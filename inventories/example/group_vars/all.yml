---
pi_hostname: openclaw-pi
pi_network_mode: dhcp
pi_static_address: ""
pi_static_gateway: ""
pi_dns_servers: []
pi_manage_network: false
pi_network_connection: "Wired connection 1"
admin_user: gromer
admin_groups: [sudo]
admin_ssh_public_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEXAMPLEONLYNOTAKEY replace@example
openclaw_user: gromer
openclaw_group: gromer
openclaw_version: "2026.9.6"
# Verify against npm registry dist.integrity metadata before release.
openclaw_npm_integrity: "sha512-Ie0kyQSCVfFqixsgVg39vevUDq01Ch5u3+7Yu5Y3qARczmdAe+lzp8bVnO9925rHiW/+CFp70zfORCyPmCH31g=="
openclaw_home_dir: "/home/{{ openclaw_user }}"
openclaw_npm_prefix: "{{ openclaw_home_dir }}/.npm-global"
openclaw_state_dir: "{{ openclaw_home_dir }}/.openclaw"
openclaw_workspace_dir: "{{ openclaw_state_dir }}/workspace"
openclaw_config_path: "{{ openclaw_state_dir }}/openclaw.json"
openclaw_secret_dir: "{{ openclaw_home_dir }}/.config/openclaw/secrets"
openclaw_gateway_token_file: "{{ openclaw_secret_dir }}/gateway-token.json"
ollama_token_file: "{{ openclaw_secret_dir }}/ollama-caddy-token.json"
openclaw_environment_path: "{{ openclaw_secret_dir }}/openclaw.env"
firecrawl_secret_enabled: false
firecrawl_environment_path: "{{ openclaw_secret_dir }}/firecrawl.env"
openclaw_gateway_port: 18789
openclaw_gateway_bind: lan
openclaw_control_ui_allowed_origins:
  - "http://{{ ansible_default_ipv4.address }}:{{ openclaw_gateway_port }}"
  - "http://{{ pi_hostname }}.local:{{ openclaw_gateway_port }}"
security_gateway_allowed_cidrs:
  - "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.netmask }}"
node_major: "24"
inference_backend: ollama
inference_host: ollama.gromer.dev
inference_base_url: https://ollama.gromer.dev
inference_model: gemma4:26b-mlx
inference_context_window: 32768
inference_max_tokens: 8192
inference_timeout_seconds: 300
secrets_file: ""
sandbox_mode: all
sandbox_scope: agent
sandbox_workspace_access: none
sandbox_image: openclaw-sandbox:bookworm-slim
sandbox_network: none
sandbox_memory: 1g
sandbox_memory_swap: 1g
sandbox_cpus: 1
sandbox_pids_limit: 128
sandbox_nofile_soft: 1024
sandbox_nofile_hard: 2048
searxng_image: >-
  ghcr.io/searxng/searxng:2026.8.20-8d3dd0cd4@sha256:9fd6172d7dcec4920273995ccd33338e4cda3093a468261a479f46a2d212723b
searxng_bind_address: 127.0.0.1
searxng_port: 8888
# Explicitly opt in to exposing SearXNG on a non-loopback address.
# Must be set to true when searxng_bind_address is not 127.0.0.1/::1/localhost.
searxng_allow_lan_exposure: false
restic_enabled: false
restic_repository: ""
restic_backup_paths:
  - "{{ openclaw_state_dir }}"
restic_schedule: "*-*-* 03:30:00"
restic_keep_daily: 7
restic_keep_weekly: 5
restic_keep_monthly: 12
restic_check_schedule: "Sun *-*-* 04:30:00"
restic_max_backup_age_hours: 36
restic_freshness_schedule: "*-*-* 06:00:00"
