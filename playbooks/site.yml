---
- name: Provision OpenClaw Raspberry Pi gateway
  hosts: all
  become: true
  gather_facts: true
  pre_tasks:
    - name: Validate inventory
      ansible.builtin.import_tasks: validate.yml
  roles:
    - common
    - users
    - security
    - docker
    - sandbox
    - openclaw
    - searxng
    - restic
    - verification
